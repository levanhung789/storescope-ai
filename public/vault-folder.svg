<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 104" fill="none">
  <defs>
    <!-- Body gradient: deep purple → magenta pink -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="120" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6d28d9"/>
      <stop offset="40%"  stop-color="#9333ea"/>
      <stop offset="75%"  stop-color="#db2777"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <!-- Tab gradient -->
    <linearGradient id="tabGrad" x1="0" y1="0" x2="60" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Glass shine diagonal -->
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="white" stop-opacity="0.38"/>
      <stop offset="45%"  stop-color="white" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <!-- Inner glow on left edge -->
    <linearGradient id="edgeGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <!-- Drop shadow -->
    <filter id="shadow" x="-15%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#9333ea" flood-opacity="0.45"/>
    </filter>
    <!-- Clip for shine inside body -->
    <clipPath id="bodyClip">
      <rect x="9" y="38" width="102" height="58" rx="11"/>
    </clipPath>
  </defs>

  <!-- ── Tab (back plate) ── -->
  <path d="M9 40 L9 33 Q9 26 16 26 L46 26 Q52 26 54 32 L58 40 Z"
        fill="url(#tabGrad)"/>
  <!-- Tab top highlight line -->
  <path d="M16 27 Q15 27 14 28 L9 32" stroke="white" stroke-opacity="0.22" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ── Main folder body ── -->
  <rect x="9" y="38" width="102" height="58" rx="11"
        fill="url(#bodyGrad)" filter="url(#shadow)"/>

  <!-- Top edge bright highlight -->
  <rect x="9" y="38" width="102" height="2.5" rx="1.25"
        fill="white" opacity="0.32"/>

  <!-- Left edge inner glow -->
  <rect x="9" y="40" width="18" height="54" rx="0"
        fill="url(#edgeGlow)" clip-path="url(#bodyClip)"/>

  <!-- Glass shine ellipse (diagonal, top-left quadrant) -->
  <ellipse cx="44" cy="59" rx="30" ry="17"
           fill="url(#shineGrad)"
           transform="rotate(-22 44 59)"
           clip-path="url(#bodyClip)"/>

  <!-- Bottom subtle reflection line -->
  <rect x="9" y="93" width="102" height="2" rx="1"
        fill="white" opacity="0.06" clip-path="url(#bodyClip)"/>
</svg>
